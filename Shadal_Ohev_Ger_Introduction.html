<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
<meta charset="UTF-8">
<title>אוהב גר - הקדמה | שד״ל</title>
<style>
  @page { size: A4 landscape; margin: 1.5cm; }
  body { font-family: "David", "Times New Roman", serif; font-size: 14px; line-height: 1.7; direction: rtl; margin: 0 auto; padding: 1.5em; color: #1a1a1a; }
  header { text-align: center; margin-bottom: 1em; }
  header h1 { font-size: 1.8em; margin: 0.1em 0; }
  header h2 { font-size: 1.1em; font-weight: normal; color: #444; margin: 0.5em 0; }
  #content { column-count: 2; column-gap: 2.5em; column-rule: 1px solid #ccc; direction: rtl; }
  p { text-align: justify; text-indent: 1.5em; margin: 0.5em 0; }
  hr { border: none; border-top: 1px solid #ccc; margin: 1em 0; }
  .source { text-align: center; font-size: 0.85em; color: #888; margin-top: 1.5em; column-span: all; }
  #loading { text-align: center; padding: 3em; color: #888; column-span: all; }
  @media print { body { font-size: 11px; padding: 0; } #loading { display: none; } }
</style>
</head>
<body>
<header>
<h1>אוהב גר</h1>
<h1>הקדמה</h1>
<h2>שמואל דוד לוצאטו (שד״ל)</h2>
</header>
<hr>
<div id="content"><p id="loading">טוען...</p></div>
<hr>
<p class="source">Source: <a href="https://www.sefaria.org/Ohev_Ger">Sefaria.org</a> — Ohev Ger, Introduction</p>
<script>
fetch('https://www.sefaria.org/api/texts/Ohev_Ger,_Introduction')
  .then(r => r.json())
  .then(data => {
    const el = document.getElementById('content');
    el.innerHTML = data.he
      .filter(p => p.trim())
      .map(p => '<p>' + p + '</p>')
      .join('\n');
  })
  .catch(e => {
    document.getElementById('loading').textContent = 'Error loading text: ' + e.message;
  });
</script>
</body>
</html>
